<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>AddVoid Extension</title>
  <style>
    :root {
      --bg-color: #0c0f12;
      --panel-color: #14191f;
      --accent-color: #00ff66;
      --accent-dim: rgba(0, 255, 102, 0.15);
      --text-color: #e2e8f0;
      --text-muted: #64748b;
      --border-color: #2e3846;
      --error-color: #ff3366;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Courier New', Courier, monospace;
    }

    body {
      width: 340px;
      background-color: var(--bg-color);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      overflow-x: hidden;
    }

    header {
      padding: 14px;
      border-bottom: 1px solid var(--border-color);
      background-color: var(--panel-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo-container {
      display: flex;
      flex-direction: column;
    }

    .title {
      font-size: 16px;
      font-weight: bold;
      color: var(--accent-color);
      letter-spacing: 1px;
      text-shadow: 0 0 4px var(--accent-color);
    }

    .version {
      font-size: 9px;
      color: var(--text-muted);
    }

    /* Switch on/off */
    .switch-container {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 22px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: var(--border-color);
      transition: .3s;
      border-radius: 20px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 4px;
      bottom: 4px;
      background-color: var(--text-color);
      transition: .3s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: var(--accent-color);
      box-shadow: 0 0 6px var(--accent-color);
    }

    input:checked + .slider:before {
      transform: translateX(22px);
      background-color: var(--bg-color);
    }

    .content-box {
      padding: 14px;
    }

    /* Status indicator */
    .status-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background-color: var(--accent-dim);
      border: 1px solid var(--accent-color);
      color: var(--accent-color);
      border-radius: 4px;
      padding: 8px;
      font-size: 10px;
      text-align: center;
      margin-bottom: 12px;
      font-weight: bold;
    }

    .status-badge.inactive {
      background-color: rgba(255, 51, 102, 0.1);
      border-color: var(--error-color);
      color: var(--error-color);
    }

    /* Grid counters */
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }

    .stat-card {
      background-color: var(--panel-color);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      padding: 10px;
      text-align: center;
    }

    .stat-card.span-2 {
      grid-column: span 2;
    }

    .stat-num {
      font-size: 20px;
      font-weight: bold;
      color: var(--accent-color);
      margin-bottom: 4px;
    }

    .stat-card.inactive .stat-num {
      color: var(--text-muted);
    }

    .stat-label {
      font-size: 9px;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    /* Console logs */
    .console-header {
      font-size: 10px;
      color: var(--text-muted);
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
    }

    .console-box {
      width: 100%;
      height: 120px;
      background-color: #07090b;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      padding: 6px;
      overflow-y: auto;
      font-size: 9px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .log-line {
      line-height: 12px;
      word-break: break-all;
    }

    .log-time {
      color: var(--text-muted);
      margin-right: 4px;
    }

    .log-src {
      color: #38bdf8;
      margin-right: 4px;
    }

    .type-blocked { color: #f59e0b; }
    .type-sanitized { color: #a855f7; }
    .type-cosmetic { color: #22c55e; }
    .type-evasion { color: #06b6d4; font-weight: bold; }
    .type-info { color: #94a3b8; }
  </style>
</head>
<body>
  <header>
    <div class="logo-container">
      <div class="title">AddVoid</div>
      <div class="version">CONEXIÓN SIGILOSA [v1.2.0]</div>
    </div>
    <div class="switch-container">
      <span class="version">ON/OFF</span>
      <label class="switch">
        <input type="checkbox" id="status-toggle" checked>
        <span class="slider"></span>
      </label>
    </div>
  </header>

  <div class="content-box">
    <div id="env-badge" class="status-badge">
      ⚡ CONTEXTO MAIN_WORLD SEGURO Y ACTIVO
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <div id="count-mocks" class="stat-num">0</div>
        <div class="stat-label">Desvíos Red (200 OK)</div>
      </div>
      <div class="stat-card">
        <div id="count-sanitized" class="stat-num">0</div>
        <div class="stat-label">Payloads Sanitizados</div>
      </div>
      <div class="stat-card span-2">
        <div id="count-cosmetic" class="stat-num">0</div>
        <div class="stat-label">Reglas CSS Estéticas Inmutables</div>
      </div>
    </div>

    <div class="console-header">
      <span>REGISTRO DE EVASIONES EN VIVO</span>
      <span style="color: var(--accent-color);">● ESCUCHANDO</span>
    </div>
    <div id="console" class="console-box">
      <div class="log-line"><span class="log-time">[08:18]</span><span class="log-src">[sys]</span>Inicializando conexión sigilosa con background...</div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
